plugins {
    id "com.android.application"
}

def webAppUrl = providers.gradleProperty("webAppUrl").getOrElse("https://g-med.uz/")

android {
    namespace "uz.gmed.liza"
    compileSdk 34

    defaultConfig {
        applicationId "uz.gmed.liza"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "WEB_APP_URL", "\"${webAppUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
