version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: hospitoll_db
    environment:
      POSTGRES_DB: ${DB_NAME:-hospitoll_db}
      POSTGRES_USER: ${DB_USER:-hospitoll_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hospitoll_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospitoll_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hospitoll_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospitoll_network

  # Backend API
  backend:
    build:
      context: ./hospitoll_backend
      dockerfile: Dockerfile
    container_name: hospitoll_backend
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DB_ENGINE: postgresql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CACHE_LOCATION: redis://redis:6379/1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,https://${DOMAIN},https://www.${DOMAIN}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
      FRONTEND_URL: https://${DOMAIN}
    ports:
      - "8000:8000"
    volumes:
      - ./hospitoll_backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    networks:
      - hospitoll_network
    restart: unless-stopped

  # Celery Worker
  celery_worker:
    build:
      context: ./hospitoll_backend
      dockerfile: Dockerfile
    container_name: hospitoll_celery_worker
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DB_ENGINE: postgresql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./hospitoll_backend:/app
      - logs_volume:/app/logs
    depends_on:
      - db
      - redis
    command: celery -A config worker -l info
    networks:
      - hospitoll_network
    restart: unless-stopped

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      context: ./hospitoll_backend
      dockerfile: Dockerfile
    container_name: hospitoll_celery_beat
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DB_ENGINE: postgresql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./hospitoll_backend:/app
      - logs_volume:/app/logs
    depends_on:
      - db
      - redis
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - hospitoll_network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./hospitoll_frontend
      dockerfile: Dockerfile
    container_name: hospitoll_frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend
    networks:
      - hospitoll_network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: hospitoll_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - hospitoll_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:

networks:
  hospitoll_network:
    driver: bridge
