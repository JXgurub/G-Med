name: CI Validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospitoll_backend
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: hospitoll_backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Pillow

      - name: Django system check
        run: python manage.py check

      - name: Medical stats regression tests
        run: python manage.py test apps.medical.tests -v 2

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospitoll_frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hospitoll_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build
